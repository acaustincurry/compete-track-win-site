<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You've been called out — Compete. Track. Win.</title>

  <!-- Open Graph / iMessage rich preview. For a per-callout preview ("Alex called you out"),
       have the server inject og:title/og:description from the {code}; the static copy below is
       the safe default. -->
  <meta property="og:title" content="You've been called out 🏆">
  <meta property="og:description" content="Verified workouts. Winner takes it. Join the challenge on Compete. Track. Win.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://compete-track-win.com/og-callout.png">
  <meta name="apple-itunes-app" content="app-id=PLACEHOLDER_APPLE_ID">

  <style>
    :root { --navy900:#16181C; --navy700:#1E2128; --volt:#C6FF2E; --mist:#8A9099; --text:#F4F6F7; }
    html,body{margin:0;height:100%;background:var(--navy900);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
    .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:32px;gap:18px;}
    .mark{width:96px;height:96px;}
    h1{font-size:26px;margin:0;}
    p{color:var(--mist);max-width:340px;line-height:1.5;margin:0;}
    .code{font-family:ui-monospace,monospace;letter-spacing:4px;font-size:20px;color:var(--volt);}
    a.cta{margin-top:8px;background:var(--volt);color:var(--navy900);font-weight:700;text-decoration:none;
      padding:15px 28px;border-radius:14px;font-size:17px;}
    .fine{font-size:12px;color:var(--mist);}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mark" src="https://compete-track-win.com/mark_volt.png" alt="Compete. Track. Win.">
    <h1>You've been called out 🏆</h1>
    <p>A friend challenged you on <b>Compete. Track. Win.</b> — Apple-Watch-verified workouts, winner takes it.</p>
    <div class="code" id="code"></div>
    <a class="cta" id="cta" href="#">Get the app &amp; join</a>
    <p class="fine">Already have the app? It should open automatically. Otherwise tap above.</p>
  </div>

  <script>
    // The invite code is the last path segment (/c/{CODE}).
    var code = (location.pathname.split("/").filter(Boolean).pop() || "").toUpperCase();
    document.getElementById("code").textContent = code ? "CODE " + code : "";
    // PLACEHOLDER_APP_STORE_URL — replace with the real App Store URL once the app is live.
    var APP_STORE_URL = "https://apps.apple.com/app/idPLACEHOLDER_APPLE_ID";
    document.getElementById("cta").href = APP_STORE_URL;
    // If the app is installed, the Universal Link opens it directly and this page never renders.
    // For non-installed visitors we just point at the App Store (above).
  </script>
</body>
</html>
